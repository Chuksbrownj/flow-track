name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test, typecheck & lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Node 24 / npm 11 matches the toolchain that generates the lockfile.
          # Node 22's bundled npm 10 re-resolves vite's peer esbuild differently
          # and fails `npm ci` against an npm-11 lockfile.
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

  integration:
    name: Integration tests (Neon)
    runs-on: ubuntu-latest
    needs: [test]
    # Secrets/vars aren't available on PRs from forks, so skip those.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set branch expiry
        run: echo "EXPIRES_AT=$(date -u --date '+1 day' +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - name: Create Neon branch
        id: create-branch
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch_name: ci-${{ github.run_id }}-${{ github.run_attempt }}
          expires_at: ${{ env.EXPIRES_AT }}

      - name: Run migrations
        run: npm run db:migrate
        env:
          DATABASE_URL: ${{ steps.create-branch.outputs.db_url }}

      - name: Run integration tests
        run: npm run test:integration
        env:
          DATABASE_URL: ${{ steps.create-branch.outputs.db_url }}

      - name: Delete Neon branch
        if: always() && steps.create-branch.outcome == 'success'
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch: ci-${{ github.run_id }}-${{ github.run_attempt }}
